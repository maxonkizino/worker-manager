spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/notification_db
    username: taskflow
    password: taskflow
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: kafka:29092

taskflow:
  kafka:
    enabled: true

eureka:
  client:
    enabled: false
