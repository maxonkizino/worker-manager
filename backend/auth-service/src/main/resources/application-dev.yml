spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/auth_db
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

taskflow:
  auth:
    refresh-cookie:
      secure: false
