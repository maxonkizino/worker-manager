server:
  port: 8081

spring:
  application:
    name: auth-service
  profiles:
    active: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
  data:
    redis:
      repositories:
        enabled: false

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /swagger-ui.html

taskflow:
  auth:
    lock:
      max-attempts: 5
      duration: 15m
    refresh-cookie:
      name: refreshToken
      path: /api/auth
      secure: false
      same-site: Lax
      max-age: 7d
  jwt:
    secret: ${JWT_SECRET:taskflow-local-jwt-secret-key-min-32-chars!!}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  kafka:
    enabled: false
    user-events-topic: user.events
  redis:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/auth_db
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    enabled: false

logging:
  level:
    com.taskflow.auth: INFO
