spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/auth_db
    username: taskflow
    password: taskflow
  kafka:
    bootstrap-servers: kafka:29092
  data:
    redis:
      host: redis
      port: 6379

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://eureka-service:8761/eureka/

taskflow:
  auth:
    refresh-cookie:
      secure: false
  kafka:
    enabled: true
  redis:
    enabled: true
