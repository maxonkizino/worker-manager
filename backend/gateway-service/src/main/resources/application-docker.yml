server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 20MB
  http:
    codecs:
      max-in-memory-size: 20MB
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: auth-service
              uri: ${GATEWAY_AUTH_URI:http://auth-service:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**

            - id: user-service
              uri: ${GATEWAY_USER_URI:http://user-service:8082}
              predicates:
                - Path=/api/employees/**,/api/departments/**,/api/skills/**,/api/schedules/**,/api/non-working-days/**,/api/absences/**,/api/settings/**

            - id: task-service
              uri: ${GATEWAY_TASK_URI:http://task-service:8083}
              predicates:
                - Path=/api/projects/**,/api/tasks/**,/api/assignments/**,/api/time-entries/**

            - id: analytics-service
              uri: ${GATEWAY_ANALYTICS_URI:http://analytics-service:8084}
              predicates:
                - Path=/api/load/**,/api/reports/**,/api/audit/**

            - id: optimization-service
              uri: ${GATEWAY_OPTIMIZATION_URI:http://optimization-service:8085}
              predicates:
                - Path=/api/optimization/**

            - id: notification-service
              uri: ${GATEWAY_NOTIFICATION_URI:http://notification-service:8086}
              predicates:
                - Path=/api/notifications/**,/api/calendar/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:5173
                  - http://localhost:3000
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

  main:
    web-application-type: reactive

jwt:
  secret: ${JWT_SECRET:taskflow-dev-secret-change-me-32chars-min}
  access-token-expiration: 900000
  issuer: auth-service

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://eureka-service:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway,routes,health,info
      base-path: /actuator
