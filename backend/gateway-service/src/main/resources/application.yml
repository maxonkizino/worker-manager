server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 20MB
  http:
    codecs:
      max-in-memory-size: 20MB
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: auth-service
              uri: ${GATEWAY_AUTH_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**

            - id: user-service
              uri: ${GATEWAY_USER_URI:http://localhost:8082}
              predicates:
                - Path=/api/employees/**,/api/departments/**,/api/skills/**,/api/schedules/**,/api/non-working-days/**,/api/absences/**,/api/settings/**

            - id: task-service
              uri: ${GATEWAY_TASK_URI:http://localhost:8083}
              predicates:
                - Path=/api/projects/**,/api/tasks/**,/api/assignments/**,/api/time-entries/**

            - id: analytics-service
              uri: ${GATEWAY_ANALYTICS_URI:http://localhost:8084}
              predicates:
                - Path=/api/load/**,/api/reports/**,/api/audit/**

            - id: optimization-service
              uri: ${GATEWAY_OPTIMIZATION_URI:http://localhost:8085}
              predicates:
                - Path=/api/optimization/**

            - id: notification-service
              uri: ${GATEWAY_NOTIFICATION_URI:http://localhost:8086}
              predicates:
                - Path=/api/notifications/**,/api/calendar/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:5173
                  - http://localhost:3000
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

  main:
    web-application-type: reactive

jwt:
  secret: ${JWT_SECRET:taskflow-local-jwt-secret-key-min-32-chars!!}
  access-token-expiration: 900000
  issuer: auth-service

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway,routes,health,info
      base-path: /actuator
