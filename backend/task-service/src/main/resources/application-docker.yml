spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/task_db
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}

taskflow:
  user-service:
    base-url: http://user-service:8082
  kafka:
    enabled: true

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-service:8761/eureka/}
