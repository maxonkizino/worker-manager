server:
  port: 8083

spring:
  application:
    name: task-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/task_db
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
    driver-class-name: org.postgresql.Driver

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /swagger-ui.html

taskflow:
  user-service:
    base-url: http://localhost:8082
  kafka:
    enabled: false
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    task-events-topic: task.events
    timeentry-events-topic: timeentry.events

logging:
  level:
    com.taskflow.task: INFO
